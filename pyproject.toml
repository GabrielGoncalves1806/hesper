[project]
name = "hesper"
version = "0.1.0"
description = "Hesper: jogo 2D de sobrevivência e terraformação (MVP v0.1)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pedalboard>=0.9.26",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
